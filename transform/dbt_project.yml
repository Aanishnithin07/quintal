name: mandi
version: "1.0.0"
config-version: 2
profile: mandi

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Bronze is the only input. Everything here is rebuildable from it.
  # Relative default is convenient for `cd transform && dbt build`; CI and any
  # other caller export MANDI_BRONZE_GLOB with an absolute path instead.
  bronze_glob: "{{ env_var('MANDI_BRONZE_GLOB', '../data/bronze/*/records.jsonl.gz') }}"

models:
  mandi:
    staging:
      +materialized: table
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
